<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutti Frutti Neón 🚀</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="icon" type="image/png" href="images/icono_192.png">
    <!-- Fuentes y estilos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff77ff">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

    <div class="app-container">

        <!-- ==========================================
             PANTALLA 1: BIENVENIDA / INICIO
             ========================================== -->
        <div id="screen-welcome" class="screen active">
            <div class="top-utilities">
                <button class="util-btn" onclick="toggleSound()"><i class="fa-solid fa-volume-high soundIcon"></i></button>
                <button class="util-btn" onclick="toggleFullscreen()"><i class="fa-solid fa-expand fullscreenIcon"></i></button>
                <button class="util-btn" onclick="openHelpModal()"><i class="fa-solid fa-question"></i></button>
            </div>
            <div class="welcome-content">
                <img src="images/nombre.png" alt="Tutti Frutti Neón" class="game-title">
                <div class="welcome-buttons">
                    <button class="neon-btn small-btn" onclick="showLeaderboardModal()">Ver Podio 🏆</button>
                    <button class="neon-btn" onclick="goToModeSelect()">Comenzar</button>
                </div>
            </div>
            <footer class="author-signature">Creado con ❤️ Eugenia Coarasa</footer>
        </div>

        <!-- ==========================================
             PANTALLA: SELECCIÓN DE MODO
             ========================================== -->
        <div id="screen-mode-select" class="screen">
            <div class="screen-top-bar">
                <button class="util-btn home-btn" onclick="switchScreen('screen-welcome')"><i class="fa-solid fa-house"></i></button>
            </div>
            <div class="screen-inner-content">
                <h2>Elige el Modo de Juego</h2>
                <div class="welcome-buttons" style="margin-top: 30px;">
                    <button class="neon-btn" onclick="startSoloMode()">Jugar Solo (Offline)</button>
                    <button class="neon-btn secondary-btn" onclick="goToMultiplayerLobby()">Multijugador Online</button>
                </div>
            </div>
        </div>

        <!-- ==========================================
             PANTALLA: LOBBY MULTIJUGADOR
             ========================================== -->
        <div id="screen-multi-lobby" class="screen">
            <div class="screen-top-bar">
                <button class="util-btn home-btn" onclick="switchScreen('screen-mode-select')"><i class="fa-solid fa-house"></i></button>
            </div>
            <div class="screen-inner-content">
                <h2>Sala Multijugador</h2>
                <div class="initials-box" style="margin: 20px 0;">
                    <input type="text" id="roomCodeInput" placeholder="Ej: SALA123" style="text-transform: uppercase;">
                    <button class="neon-btn small-btn" onclick="joinRoom()">Entrar</button>
                </div>
                <div id="lobbyStatus" style="font-weight: bold; color: #ff007f; margin-top: 15px;"></div>
            </div>
        </div>

        <!-- ==========================================
             PANTALLA: CUENTA REGRESIVA
             ========================================== -->
        <div id="screen-countdown" class="screen">
            <div class="screen-inner-content" style="text-align: center;">
                <h2>¡Preparando la Partida!</h2>
                <p id="countdownMessage" style="font-size: 1.5rem; margin: 30px 0; color: #67079a;"></p>
                <div id="countdownTimerNum" style="font-size: 4rem; font-weight: bold; color: #ff007f;">15</div>
            </div>
        </div>

        <!-- ==========================================
             PANTALLA: RULETA DE LETRAS
             ========================================== -->
        <div id="screen-wheel" class="screen">
            <div class="screen-top-bar">
                <button class="util-btn home-btn" onclick="confirmAbandon()"><i class="fa-solid fa-house"></i></button>
            </div>
            <div class="screen-inner-content">
                <h2 id="wheelTitle">Gira la Ruleta</h2>
                <div class="difficulty-selector" id="difficultyContainer">
                    <button id="btn-easy" class="diff-btn active" onclick="setDifficulty('easy')">Fácil</button>
                    <button id="btn-medium" class="diff-btn" onclick="setDifficulty('medium')">Medio</button>
                    <button id="btn-hard" class="diff-btn" onclick="setDifficulty('hard')">Difícil</button>
                </div>
                <div class="wheel-container">
                    <div class="wheel-pointer"></div>
                    <div class="wheel" id="fairWheel"></div>
                </div>
                <button class="neon-btn" id="spinBtn" onclick="spinWheel()">GIRAR RULETA</button>
            </div>
        </div>

        <!-- ==========================================
             PANTALLA: JUEGO / TEMPORIZADOR
             ========================================== -->
        <div id="screen-game" class="screen">
            <div class="screen-top-bar">
                <button class="util-btn home-btn" onclick="confirmAbandon()"><i class="fa-solid fa-house"></i></button>
            </div>
            <div class="game-main-area">
                <div class="game-header-info">
                    <h2>Letra: <span id="displayLetter" class="highlight-letter">A</span></h2>
                    <div class="timer-text"><i class="fa-regular fa-clock"></i> <span id="timerCountdown">60</span>s</div>
                </div>
                <div class="timer-bar-container"><div class="timer-bar" id="timerBar"></div></div>
                <div id="categoriesForm" class="categories-scroll"></div>
                <button class="neon-btn" onclick="submitGame()">¡BASTA PARA MÍ, BASTA PARA TODOS!</button>
            </div>
        </div>

        <!-- ==========================================
             PANTALLA: RESULTADOS
             ========================================== -->
        <div id="screen-results" class="screen">
            <div class="screen-top-bar"></div>
            <div class="screen-inner-content" style="max-width: 700px;">
                <h2>Resultados y Discusión</h2>
                <div class="total-score" id="totalScoreText">Puntaje Total: 0 pts</div>
                <div class="results-summary" id="resultsList"></div>

                <!-- Sección de Chat -->
                <div id="chatSection" style="margin-top: 20px; border: 2px solid #ff007f; border-radius: 12px; padding: 10px; background: rgba(255,255,255,0.8); display: none;">
                    <h4 style="color: #ff007f; margin-bottom: 5px;"><i class="fa-solid fa-comments"></i> Chat</h4>
                    <div id="chatMessages" style="height: 100px; overflow-y: auto; text-align: left; font-size: 0.9rem; margin-bottom: 8px; border-bottom: 1px solid #ddd; padding: 4px;"></div>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="chatInput" placeholder="Discute tus puntos aquí..." style="flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #ccc;">
                        <button class="neon-btn small-btn" onclick="sendChatMessage()">Enviar</button>
                    </div>
                </div>

                <!-- Guardado de puntaje -->
                <div id="saveScoreSection" style="margin-top: 15px;">
                    <p class="score-prompt">Guarda tus iniciales en el podio:</p>
                    <div class="initials-box">
                        <input type="text" id="playerInitials" maxlength="3" placeholder="ABC">
                        <button class="neon-btn small-btn" onclick="saveScore()">Guardar</button>
                    </div>
                </div>

                <!-- Botones finales -->
                <button class="neon-btn secondary-btn" onclick="resetGame()" style="margin-top: 10px; width: 100%;">Jugar de Nuevo</button>
                
                <!-- NUEVO BOTÓN: Sugerir palabra -->
                <button onclick="abrirModalSugerenciaPartida()" class="neon-btn" style="margin-top: 10px; width: 100%;">
                    💡 Sugerir al Diccionario
                </button>
            </div>
        </div>
    </div> <!-- Cierre del app-container -->

    <!-- ==========================================
         MODALES (Ventanas emergentes)
         ========================================== -->

    <!-- Modal de Ayuda -->
    <div id="helpModal" class="modal-overlay">
        <div class="modal-card">
            <h3>¿Cómo Jugar?</h3>
            <button class="neon-btn small-btn" onclick="closeHelpModal()" style="margin-top: 15px;">¡ENTENDIDO!</button>
        </div>
    </div>

    <!-- Modal de Aviso Personalizado -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-card custom-modal-card">
            <h3 id="customModalTitle">Aviso</h3>
            <p id="customModalMessage"></p>
            <div class="custom-modal-buttons" id="customModalButtons"></div>
        </div>
    </div>

    <!-- Modal de Sugerencia Restringida (Uso en partida) -->
<div id="modalSugerenciaPartida" class="modal-overlay" style="display: none;">
    <div class="modal-card custom-modal-card" style="text-align: center; padding: 25px; max-width: 400px; width: 90%;">
        <h3>💡 Sugerir Palabra</h3>
        <p id="contadorSugerencias" style="font-size: 15px; font-weight: 700; opacity: 0.8; margin-bottom: 15px;"></p>
        
        <div style="margin-bottom: 15px; text-align: left;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Categoría:</label>
            <select id="selectSugerenciaCat" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc;"></select>
        </div>

        <div style="margin-bottom: 15px; text-align: left;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Letra:</label>
            <input type="text" id="inputSugerenciaLetra" readonly style="width: 100%; padding: 8px; background: #f0f0f0; border-radius: 8px; border: 1px solid #ccc; text-align: center; font-weight: bold;">
        </div>

        <div style="margin-bottom: 20px; text-align: left;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Palabra:</label>
            <input type="text" id="inputSugerenciaPalabra" placeholder="Escribe tu palabra..." style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; text-transform: uppercase;">
        </div>

        <!-- Botones organizados en proporciones iguales -->
        <div style="display: flex; gap: 10px; justify-content: center; width: 100%; margin-top: 10px;">
            <button onclick="enviarSugerenciaRestringida()" class="neon-btn" style="flex: 1; padding: 10px; font-size: 14px;">Enviar</button>
            <button onclick="cerrarModalSugerenciaPartida()" class="neon-btn" style="flex: 1; padding: 10px; font-size: 14px;">Cerrar</button>
        </div>
    </div>
</div>

    <!-- Modal de Sugerencia Simple -->
    <div id="suggestModal" class="modal-overlay" style="display: none;">
        <div class="modal-card custom-modal-card">
            <h3>💡 Sugerir nueva palabra</h3>
            <p id="suggestInfoText"></p>
            <input type="text" id="suggestWordInput" placeholder="Escribe la palabra...">
            <button onclick="enviarSugerenciaServidor()" class="neon-btn">Enviar</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="diccionario.js"></script>
    <script src="script.js"></script>

</body>
</html>
